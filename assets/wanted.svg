    <path id="star" d="M0,-30 L8.8,-12.1 L28.5,-9.3 L14.3,4.6 L17.6,24.3 L0,15 L-17.6,24.3 L-14.3,4.6 L-28.5,-9.3 L-8.8,-12.1 Z"/>
